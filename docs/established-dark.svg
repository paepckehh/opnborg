<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-label="OPNBORG: established in September 2024, 2 years of continuous public development on GitHub, 291+ tagged releases">
  <title>OPNBORG - established September 2024, 2 years on GitHub</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a11"/>
      <stop offset="0.55" stop-color="#0b1524"/>
      <stop offset="1" stop-color="#101a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#4a9eff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4a9eff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a9eff"/>
      <stop offset="1" stop-color="#a06bff"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a9eff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#a06bff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1200" height="130" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="130" rx="20" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="129" rx="19.5" fill="none" stroke="#2c4a70"/>
  <rect x="40" y="0" width="520" height="2" fill="url(#edge)"/>

  <path d="M70 28 L98 44 V92 L70 108 L42 92 V44 Z" fill="url(#mark)"/>
  <path d="M56 67 L67 78 L86 55" fill="none" stroke="#061018" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="124" y="44" class="mono" font-size="12" letter-spacing="2.6" fill="#7cc7ff">ESTABLISHED SEPTEMBER 2024</text>
  <text x="124" y="76" class="sans" font-size="26" font-weight="700" letter-spacing="-0.5" fill="#eaf2ff">2 years of continuous public development on GitHub</text>
  <text x="124" y="102" class="mono" font-size="12.5" fill="#8ea3bd">open source &#183; single binary &#183; zero runtime dependencies &#183; CGO-free</text>

  <g filter="url(#soft)">
    <rect x="762" y="27" width="398" height="76" rx="14" fill="#0b1322" stroke="#22405f"/>
    <path d="M792 47 L798.5 50.7 V58.1 L792 61.8 L785.5 58.1 V50.7 Z" fill="#4a9eff"/>
    <text x="816" y="58" class="mono" font-size="14" fill="#e2e8f0">github.com/paepckehh/opnborg</text>
    <text x="816" y="80" class="mono" font-size="11.5" fill="#7d92ac">291+ tagged releases &#183; BSD-3-Clause</text>
  </g>
</svg>
